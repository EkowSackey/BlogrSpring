spring:
  application:
    name: blogr
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
  cache:
    type: caffeine
    cache-names: posts, users, post-pages, analytics-posts, analytics-users, analytics-authors, analytics-tags, analytics-reviews
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

logging:
  level:
    com.example.demo.aspect: DEBUG
#    org.springframework.aop: DEBUG

springdoc:
  packages-to-scan: com.example.demo.controllers
  paths-to-exclude: /graphql

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
