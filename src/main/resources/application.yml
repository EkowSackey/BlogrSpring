spring:
  application:
    name: blogr
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
  cache:
    type: caffeine
    cache-names: posts, users, post-pages
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

logging:
  level:
    com.example.demo.aspect: DEBUG
#    org.springframework.aop: DEBUG

springdoc:
  packages-to-scan: com.example.demo.controllers
  paths-to-exclude: /graphql

jwt:
  secret: ${JWT_SECRET}