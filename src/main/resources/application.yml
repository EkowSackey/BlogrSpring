spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: blogr
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/blogr}
      auto-index-creation: false # Disable auto-creation in production for better control
      pool:
        min-size: 10 # Maintain a minimum number of connections
        max-size: 50 # Allow the pool to grow under load
        max-idle-time: 60000 # 1 minute
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
  cache:
    type: caffeine
    cache-names: posts, users, post-pages, analytics-posts, analytics-users, analytics-authors, analytics-tags, analytics-reviews
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/graphql

logging:
  level:
    com.example.demo.aspect: DEBUG

springdoc:
  packages-to-scan: com.example.demo.controllers
  paths-to-exclude: /graphql

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
